# 운영 DB 에서 영문·일문 칸이 빈 필름·현상소·수리점을 로그로 출력한다(수동 실행).
#
# 관리 화면에서만 등록한 항목은 저장소의 data/*.json 사본에 없어 번역할 원문을 볼 수 없다.
# 이 워크플로우를 돌려 로그에서 원문을 확인한 뒤 번역을 마이그레이션이나 관리 화면 영문·일문 칸으로 채운다.
#
# 읽기만 한다. 공개 화면과 같은 anon 키(js/db-client.js 에 실린 공개 키)로 공개 행만 읽는다.
name: en-missing

on:
  workflow_dispatch:
  # 이 파일을 고치는 PR 에서도 돈다(수동 실행 권한이 없는 환경에서 로그를 보려고)
  pull_request:
    paths:
      - '.github/workflows/en-missing.yml'

permissions:
  contents: read

jobs:
  peek:
    runs-on: ubuntu-latest
    env:
      SB_URL: https://pucpqsfwqouqohwsvmnd.supabase.co
      SB_ANON: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB1Y3Bxc2Z3cW91cW9od3N2bW5kIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgxNjYyMDUsImV4cCI6MjA5Mzc0MjIwNX0.adLzT0UrX3e1IbkQ70G6LeFWeKbuGaa0PTL6AmrSBD8
    steps:
      - name: 영문 소개글이 빈 필름
        run: |
          curl -sS "$SB_URL/rest/v1/films?select=slug,brand,name,display_name,iso,type,format,description&description_en=is.null&description=not.is.null&order=slug" \
            -H "apikey: $SB_ANON" -H "Authorization: Bearer $SB_ANON" | python3 -m json.tool --no-ensure-ascii
      - name: 영문 칸이 빈 현상소
        run: |
          curl -sS "$SB_URL/rest/v1/labs?select=name,region,address,features&name_en=is.null&order=region,name" \
            -H "apikey: $SB_ANON" -H "Authorization: Bearer $SB_ANON" | python3 -m json.tool --no-ensure-ascii
      - name: 영문 칸이 빈 수리점
        run: |
          curl -sS "$SB_URL/rest/v1/repair_shops?select=name,region,address,specialty,description&name_en=is.null&order=region,name" \
            -H "apikey: $SB_ANON" -H "Authorization: Bearer $SB_ANON" | python3 -m json.tool --no-ensure-ascii
      - name: 일문 소개글이 빈 필름
        run: |
          curl -sS "$SB_URL/rest/v1/films?select=slug,brand,name,display_name,iso,type,format,description&description_ja=is.null&description=not.is.null&order=slug" \
            -H "apikey: $SB_ANON" -H "Authorization: Bearer $SB_ANON" | python3 -m json.tool --no-ensure-ascii
      - name: 일문 칸이 빈 현상소
        run: |
          curl -sS "$SB_URL/rest/v1/labs?select=name,region,address,features&name_ja=is.null&order=region,name" \
            -H "apikey: $SB_ANON" -H "Authorization: Bearer $SB_ANON" | python3 -m json.tool --no-ensure-ascii
      - name: 일문 칸이 빈 수리점
        run: |
          curl -sS "$SB_URL/rest/v1/repair_shops?select=name,region,address,specialty,description&name_ja=is.null&order=region,name" \
            -H "apikey: $SB_ANON" -H "Authorization: Bearer $SB_ANON" | python3 -m json.tool --no-ensure-ascii
