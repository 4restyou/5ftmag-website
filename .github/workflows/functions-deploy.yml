name: Supabase DB and Edge Functions

# DB와 함수를 같은 체크아웃에서 순서대로 배포한다. 마이그레이션 실패 시 함수도 배포하지 않는다.
# 필요한 시크릿 (GitHub Settings → Secrets → Actions):
#   SUPABASE_ACCESS_TOKEN  — supabase CLI 로그인 토큰
#   SUPABASE_DB_PASSWORD  — DB 비밀번호
#
# 함수가 사용하는 런타임 시크릿 (Supabase Dashboard → Edge Functions → Secrets) 은
# 함수 코드 안 process.env / Deno.env 로 읽음. 별도로 한 번만 설정:
#   VAPID_PUBLIC_KEY, VAPID_PRIVATE_KEY, VAPID_SUBJECT, PUSH_DISPATCH_SECRET
#   PORTONE_API_SECRET (ebook-purchase)
#   NAVER_COMMERCE_CLIENT_ID, NAVER_COMMERCE_CLIENT_SECRET (ebook-redeem)
#   NAVER_RELAY_URL, NAVER_RELAY_KEY (ebook-redeem — 고정 IP 중계, relay/ 참고)

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/migrations/**'
      - '.github/workflows/functions-deploy.yml'
  workflow_dispatch:

# 최소 권한. 이 워크플로우는 저장소를 읽기만 한다(배포 인증은 SUPABASE_ACCESS_TOKEN 시크릿).
permissions:
  contents: read

concurrency:
  group: supabase-production-pucpqsfwqouqohwsvmnd
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_REF: pucpqsfwqouqohwsvmnd

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 버전을 고정한다. latest 는 CLI 새 릴리스가 동작을 바꾸면 배포가 예고 없이 깨진다.
      # 올릴 때는 이 값을 바꾸는 PR 로 올린다(db-deploy·functions-deploy 를 같은 값으로).
      - uses: supabase/setup-cli@v1
        with:
          version: 2.119.0

      - name: Link project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Push migrations before functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push --include-all

      # supabase/functions/ 하위 폴더를 전부 배포 — 함수를 추가해도
      # 워크플로우를 고칠 필요가 없다 (하드코딩 누락 사고 방지).
      - name: Deploy all functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          for dir in supabase/functions/*/; do
            fn=$(basename "$dir")
            [[ "$fn" == _* ]] && continue
            supabase functions deploy "$fn" \
              --project-ref "$SUPABASE_PROJECT_REF" \
              --no-verify-jwt
          done
