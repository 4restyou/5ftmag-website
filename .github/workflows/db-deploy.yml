name: Supabase Migrations

# main 머지 시 supabase/migrations/*.sql 변경이 있으면 자동 적용.
# 필요한 시크릿 (GitHub Settings → Secrets → Actions):
#   SUPABASE_ACCESS_TOKEN  — supabase CLI 로그인 토큰 (https://supabase.com/dashboard/account/tokens)
#   SUPABASE_DB_PASSWORD   — DB 비밀번호 (Settings → Database → Connection Password)
#
# 프로젝트 ref(pucpqsfwqouqohwsvmnd) 는 공개정보(사이트 JS 에 노출) 라 워크플로우에 직접 박음.

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/db-deploy.yml'
  workflow_dispatch:

# 최소 권한. 이 워크플로우는 저장소를 읽기만 한다(배포 인증은 SUPABASE_ACCESS_TOKEN 시크릿).
permissions:
  contents: read

env:
  SUPABASE_PROJECT_REF: pucpqsfwqouqohwsvmnd

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 버전을 고정한다. latest 는 CLI 새 릴리스가 동작을 바꾸면 배포가 예고 없이 깨진다.
      # 올릴 때는 이 값을 바꾸는 PR 로 올린다(db-deploy·functions-deploy 를 같은 값으로).
      - uses: supabase/setup-cli@v1
        with:
          version: 2.119.0

      - name: Link project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Push migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push --include-all
