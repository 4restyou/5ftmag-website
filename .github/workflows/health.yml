name: health
# 매일 한국 시간 오전 9시 7분에 운영 상태를 확인한다. 실패하면 GitHub 이 이 워크플로우를 마지막으로
# 바꾼 사람(운영자 계정)에게 메일을 보낸다. 손으로 돌리려면 Actions → health → Run workflow.
on:
  schedule:
    - cron: '7 0 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/health-check.mjs
