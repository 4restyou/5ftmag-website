# 매일 한 번 Netlify 빌드를 깨운다.
#
# 관리 화면에서 필름·현상소를 추가하거나 기사를 비공개로 돌려도, 상세 페이지·sitemap·RSS 는
# 다음 Netlify 빌드 때만 다시 만들어진다(scripts/build-*.mjs 가 그때 DB 를 읽는다).
# 코드 배포가 며칠 없으면 그동안 반영이 밀리므로, 한국 시간 새벽 4시쯤 빌드 훅을 한 번 부른다.
#
# 빌드 훅 주소는 NETLIFY_BUILD_HOOK 시크릿에 둔다(docs/secrets-rotation.md).
# 시크릿이 없으면 실패로 만들지 않고 안내만 남긴 채 건너뛴다.
name: daily-build

on:
  schedule:
    - cron: '7 19 * * *'   # UTC 19:07 = 한국 시간 04:07
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hook:
    runs-on: ubuntu-latest
    steps:
      - name: Netlify 빌드 훅 호출
        env:
          HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::notice::NETLIFY_BUILD_HOOK 시크릿이 없어 건너뜁니다. Netlify → Site configuration → Build & deploy → Build hooks 에서 훅을 만들고, 그 주소를 GitHub 저장소 Settings → Secrets and variables → Actions 에 NETLIFY_BUILD_HOOK 으로 넣어 주세요."
            exit 0
          fi
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST -d '{}' "$HOOK?trigger_title=daily-build")
          echo "Netlify 응답: HTTP $code"
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            echo "::error::빌드 훅 호출 실패 (HTTP $code). 훅이 지워졌거나 주소가 바뀌었는지 확인해 주세요."
            exit 1
          fi
